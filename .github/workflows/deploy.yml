name: Deploy to GitHub Pages

on:
  # Manual only. Nothing here publishes itself.
  #
  # main is the living head: the docs get drafted and refined there
  # continuously, and none of that belongs on the site until someone decides it
  # does. So there is no push trigger and no tag trigger. Publish when the docs
  # are worth publishing, from Actions -> Deploy to GitHub Pages -> Run
  # workflow, picking the ref to publish.
  #
  # Publishing is restricted to `main` by the deployment rule on the
  # github-pages environment, not by a check in this file. A dispatch from a
  # feature branch is refused by GitHub before anything is built.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact. `actions: read` is
# required by deploy-pages v4+, which resolves the build artifact by ID.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer commit finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
          # v4 stopped bundling dotfiles by default, which would silently drop
          # the .nojekyll Docusaurus emits.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
